<!DOCTYPE html>
<html lang="th">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Ae-Ae jak ka dung</title>

<style>

body{
    margin:0;
    padding:0;
    font-family:sans-serif;
    background:linear-gradient(180deg,#ffcc80,#ff8a65);
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
}

.container{

    width:90%;
    max-width:420px;
    background:white;
    border-radius:30px;
    padding:25px;
    text-align:center;
    box-shadow:0 10px 40px rgba(0,0,0,0.25);

}

.logo{

    font-size:85px;

}

h1{

    margin-top:10px;
    color:#5d4037;
    font-size:34px;

}

.subtitle{

    color:#777;
    margin-bottom:20px;

}

textarea{

    width:100%;
    height:110px;
    border:none;
    background:#fff3e0;
    border-radius:20px;
    padding:15px;
    font-size:16px;
    box-sizing:border-box;
    outline:none;

}

button{

    margin-top:20px;
    width:100%;
    padding:16px;
    border:none;
    border-radius:20px;
    background:#ff6f00;
    color:white;
    font-size:20px;
    font-weight:bold;
    cursor:pointer;
    transition:0.3s;

}

button:hover{

    transform:scale(1.03);

}

.answer{

    margin-top:25px;
    background:#fff8e1;
    border-radius:20px;
    padding:20px;
    min-height:80px;
    font-size:20px;
    color:#4e342e;
    display:flex;
    justify-content:center;
    align-items:center;
    line-height:1.6;

}

.footer{

    margin-top:20px;
    color:#999;
    font-size:13px;

}

</style>
</head>

<body>

<div class="container">

<div class="logo">🐃</div>

<h1>Ae-Ae jak ka dung</h1>

<div class="subtitle">
หมอดูสายด่า แต่หวังดีกับชีวิตมรึง 🤣
</div>

<textarea
id="question"
placeholder="เช่น...แฟนเก่าจะกลับมามั้ยคะ?"
></textarea>

<button onclick="predict()">
🔮 ให้ควายทำนาย
</button>

<div class="answer" id="answer">

ถามมาเลยลูก...
ควายพร้อมด่า เอ้ย พร้อมพยากรณ์ 🐃

</div>

<div class="footer">

Powered by ควายจักรวาล 🌌

</div>

</div>

<script>

const fortunes = [

"🐃 กลับค่ะ...กลับไปกินหญ้า 😑",

"🐃 เขาไม่ได้เกลียดมรึง เขาแค่ไม่อยากตอบ 🤣",

"🐃 ดวงการเงินดี ถ้าหยุดซื้อของตอนตีสอง",

"🐃 อนาคตสดใส ถ้าตื่นก่อนเที่ยง ☀️",

"🐃 เลิกส่องเฟซแฟนเก่าได้แล้วลูก 😌",

"🐃 ช่วงนี้ควรพักผ่อน เพราะหน้าเหมือนซอมบี้รอเงินเดือน",

"🐃 ความรักกำลังจะมา...แต่มรึงยังไม่ลืมคนเก่าเลย",

"🐃 เขาอ่านข้อความมรึงแล้วค่ะ...แล้วเขาก็ไปอาบน้ำต่อ",

"🐃 ดวงวันนี้แรงมาก โดยเฉพาะแรงขี้เกียจ 🤣",

"🐃 ถ้าเอาพลังการมโนไปทำงาน ป่านนี้รวยแล้วลูก"

];

function predict(){

const random =
fortunes[Math.floor(Math.random()*fortunes.length)];

document.getElementById('answer').innerHTML = random;

}

</script>

</body>
</html>
